name: Deploy Luvie's Foods Firebase rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-rules-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luvies-foods-firebase-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Firebase deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" || -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase rules deployment skipped: add the FIREBASE_SERVICE_ACCOUNT_JSON and FIREBASE_PROJECT_ID repository secrets to enable automatic deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        if: steps.config.outputs.configured == 'true'
        run: npm install --global firebase-tools

      - name: Write Firebase service account
        if: steps.config.outputs.configured == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Luvie's Foods Firestore rules
        if: steps.config.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Check whether Storage rules changed
        id: storage-changed
        if: github.event_name == 'push' && steps.config.outputs.configured == 'true'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx 'storage.rules'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Storage rules only when the Storage rules file changes
        if: steps.config.outputs.configured == 'true' && steps.storage-changed.outputs.changed == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Remove Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
